<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="points" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">AI</span>
                <span class="points" id="aiScore">0</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong> Use <strong>W/S</strong> or <strong>UP/DOWN</strong> arrow keys to move the left paddle</p>
            <p><strong>Objective:</strong> Bounce the ball past the AI paddle to score points!</p>
            <p><strong>First to 10 wins!</strong></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
